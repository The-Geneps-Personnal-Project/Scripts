# .github/workflows/ci-reusable.yml
name: Script CI
on:
  workflow_call:
    inputs:
      script:
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests for ${{ inputs.script }}.sh
        run: |
          chmod +x ./scripts/${{ inputs.script }}.sh
          chmod +x ./tests/${{ inputs.script }}-test.sh
          ./tests/${{ inputs.script }}-test.sh
